<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>fish_room</title>

  <link rel="stylesheet" href="DomainExspansion.css">
</head>

<body class="fish-room">

<div id="main-content">

  <!-- HEADER -->
  <div class="boot-header">
    <h1>FISH_ROOM</h1>
    <p>water light • quiet bubbles • soft blue memory</p>
  </div>

  <!-- ROOM LOG -->
  <div class="section-block">
    <h2>aquarium_log</h2>

    <p style="white-space: pre-line;">
the room moves slowly.
light bends through the water.
old files drift like fish.
nothing here is rushing.
    </p>
  </div>

  <!-- ROOM IMAGE -->
  <div class="room-image">
    <img
      src="https://i.pinimg.com/originals/d1/72/42/d1724245d9cbaa1f066a9c5454072ef2.jpg"
      alt="fish room"
    >
  </div>

  <!-- STATUS -->
  <div class="section-block">
    <h2>current_status</h2>

    <p style="white-space: pre-line;">
oxygen stable...
signal floating...
memory preserved...
    </p>
  </div>

  <!-- MUSIC -->
 <audio id="roomMusic" loop>
  <source src="./music.mp3/notsomuch-[AudioTrimmer.com].mp3" type="audio/mpeg">
</audio>
  <div class="sound-panel">
    <button
      id="musicToggleButton"
      onclick="toggleRoomMusic()"
    >
      🔇 music: OFF
    </button>
  </div>

  <!-- RETURN BUTTON -->
  <div class="nav-bottom">
    <button onclick="goToPage('page2.html'); playClick()">
      ← return to archive
    </button>
  </div>

</div>

<script src="max.js"></script>

</body>
</html>
