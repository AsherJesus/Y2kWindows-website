<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>white_room</title>

  <link rel="stylesheet" href="DomainExspansion.css">
</head>

<body class="white-room">

<div id="main-content">

  <!-- HEADER -->
  <div class="boot-header">
    <h1>WHITE_ROOM</h1>
    <p>empty space • silence • unknown memory</p>
  </div>

  <!-- ROOM LOG -->
  <div class="section-block">
    <h2>void_log</h2>

    <p style="white-space: pre-line;">
the room feels unfinished.
no sound can be heard here.
the walls stretch endlessly.
something was deleted long ago.
    </p>
  </div>

  <!-- ROOM IMAGE -->
  <div class="room-image">
    <img
      src="https://mir-s3-cdn-cf.behance.net/project_modules/max_1200/478b2430194103.561767bf5c4ce.jpg"
      alt="white room"
    >
  </div>

  <!-- STATUS -->
  <div class="section-block">
    <h2>current_status</h2>

    <p style="white-space: pre-line;">
signal weak...
archive incomplete...
silence detected...
    </p>
  </div>

  <!-- MUSIC -->
<audio id="roomMusic" loop>
  <source src="./music.mp3/papulina-waiting-room-for-no-one-485626-[AudioTrimmer.com].mp3" type="audio/mpeg">
</audio>

  <div class="sound-panel">
    <button
      id="musicToggleButton"
      onclick="toggleRoomMusic()"
    >
      🔇 music: OFF
    </button>
  </div>

  <!-- RETURN BUTTON -->
  <div class="nav-bottom">
    <button onclick="goToPage('page2.html'); playClick()">
      ← return to archive
    </button>
  </div>

</div>

<script src="max.js"></script>

</body>
</html>
